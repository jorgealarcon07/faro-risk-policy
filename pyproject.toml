[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-risk-policy"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "numpy==2.2.6","pandas==2.3.3","scipy==1.15.3","scikit-learn==1.7.2",
 "mlflow-skinny==3.6.0","SQLAlchemy>=2,<2.1","alembic>=1.13,<2","psycopg[binary]==3.3.9",
 "xlrd==2.0.2","jsonschema==4.26.0","psutil==7.2.2","joblib>=1.3","threadpoolctl>=3",
]

[project.scripts]
faro-risk = "faro_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faro_risk = ["sql/*.sql","contracts/*.json","templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a dedicated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4","E7","E9","F","I","B"]
